name: Conformance Checks
on:
  pull_request:
    branches: ["0.8/dev"]
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run conformance
